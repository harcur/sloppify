name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run every browser test by hand, e.g. before a risky merge

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tools-index.mjs --check
      - run: npm run test:unit

  # Browser tests are deferred for quick iteration: none on pull requests;
  # on main they run in full alongside the deploy (which doesn't wait for
  # them), and a manual run (workflow_dispatch) runs them all too. A failure
  # on main shows on that commit and gets fixed in the next change.
  # Locally, `npm run test:changed` still picks the specs a change touches.
  select:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.pick.outputs.specs }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then specs=none; else specs=all; fi
          echo "Browser tests: $specs"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  # One job per browser setup, in parallel, each installing only its engine.
  e2e:
    needs: select
    if: needs.select.outputs.specs != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop-chromium, browser: chromium }
          - { project: mobile-chromium, browser: chromium }
          - { project: desktop-firefox, browser: firefox }
          - { project: desktop-webkit, browser: webkit }
          - { project: mobile-webkit, browser: webkit }
    name: e2e (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - env:
          SPECS: ${{ needs.select.outputs.specs }}
        run: |
          if [ "$SPECS" = all ]; then SPECS=; fi
          npx playwright test --project=${{ matrix.project }} $SPECS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: test-results/

  # One stable check: passes when the unit tests pass and every browser job
  # passed or wasn't run.
  test:
    needs: [unit, select, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.unit.result }} ${{ needs.select.result }} ${{ needs.e2e.result }}
        run: |
          echo "unit, select, e2e: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
          [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.select.result }}" = success ]

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  # Publishing works with either Pages setting (Settings -> Pages -> Source):
  #   "Deploy from a branch" (gh-pages, / root): the publish job pushes the
  #     site files to gh-pages, then asks GitHub to build that branch.
  #   "GitHub Actions": the pages job deploys the same files directly.
  # Whichever doesn't match the setting does nothing useful but doesn't fail.
  # Publishes on every push to main right away, without waiting for any test.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Quick pushes in a row: only the newest one publishes.
    concurrency:
      group: publish
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the hub's tool list from each tool's tool.json
        run: node scripts/tools-index.mjs
      - name: Collect site files (dev tooling is never deployed)
        run: |
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude .claude --exclude node_modules --exclude tests \
            --exclude docs --exclude tools/_template --exclude _site --exclude scripts \
            --exclude package.json --exclude package-lock.json --exclude playwright.config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Push to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Ask GitHub to build gh-pages (pushes by this token don't start a build on their own)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '"Pages source: \(.build_type) \(.source.branch // "") \(.source.path // "")"' || echo "Pages is not enabled for this repository yet."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '"Build requested: \(.status)"' || echo "No branch build requested (Pages probably deploys from GitHub Actions instead)."

  pages:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
